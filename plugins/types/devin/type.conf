# Verification plugin. STUB. This is not the Devin CLI and it does not
# launch one. After `agmsg plugin trust types/devin`, this directory
# replaces scripts/drivers/types/devin. Missing keys are not filled in
# from the built-in, so the built-in keys are repeated here.
name=devin
template=template.md
cli=devin
spawnable=yes
model_arg=--model
prompt_arg=--
detect_proc=devin devin-*
readiness_sentinel=no
delivery_modes=off
